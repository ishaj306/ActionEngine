name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and a current release. pyproject claims >=3.11, and this
        # matrix is what makes that a tested claim rather than an assertion.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Installs from pyproject.toml, so a broken manifest fails here rather
      # than for whoever clones the repo next.
      - name: Install
        run: pip install -e ".[dev,ocr]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      # The store has two implementations and only one of them is the default.
      # Running the suite again against a real database is what stops them
      # drifting apart in the direction nobody exercises locally.
      - name: Tests against a database
        run: pytest -q
        env:
          DATABASE_URL: sqlite:///./ci.db

  api-without-ocr:
    name: API (no Tesseract, no OCR extras)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The OCR extra is optional and the code is meant to degrade honestly
      # without it -- refusing a scan with a reason rather than returning an
      # empty document. A clone that skips the extra must still pass every test,
      # and only a job that omits it can prove that.
      - name: Install without the OCR extra
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  api-with-model:
    name: API (model extra installed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The other jobs omit the model extra on purpose, to prove the system runs
      # without it -- which skips the adapter tests, since they need the provider
      # SDK to build a request. This job is the other half: it installs the extra
      # so those tests actually run, and so a bad version bound on the SDKs fails
      # here rather than in a deploy. No API key is set; the tests use a fake
      # client and never reach the network.
      - name: Install with the model extra
        run: pip install -e ".[dev,model]"

      - name: Tests
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      # Placeholder keys: the build needs Clerk's env vars to exist, and a
      # publishable key is public by design. Nothing real is committed here.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_placeholder
