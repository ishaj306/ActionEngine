name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and a current release. pyproject claims >=3.11, and this
        # matrix is what makes that a tested claim rather than an assertion.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Installs from pyproject.toml, so a broken manifest fails here rather
      # than for whoever clones the repo next.
      - name: Install
        run: pip install -e ".[dev,ocr]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  api-without-ocr:
    name: API (no Tesseract, no OCR extras)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The OCR extra is optional and the code is meant to degrade honestly
      # without it -- refusing a scan with a reason rather than returning an
      # empty document. A clone that skips the extra must still pass every test,
      # and only a job that omits it can prove that.
      - name: Install without the OCR extra
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
